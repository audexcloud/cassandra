kind = "web"
previewPath = "/"
title = "Cassandra"
version = "1.0.0"
id = "artifacts/cassandra"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21209

[services.development]
run = "pnpm --filter @workspace/cassandra run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cassandra", "run", "build" ]
publicDir = "artifacts/cassandra/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21209"
BASE_PATH = "/"
